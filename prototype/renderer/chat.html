<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:"><title>chat</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
  #chat{position:relative;width:312px;margin:4px 4px 14px;background:#fffaf2;color:#3a2f2a;border:2px solid #f0b8c8;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.28);font:13px/1.55 "Malgun Gothic",sans-serif;padding:8px 10px 8px}
  #chat:after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-9px;border:9px solid transparent;border-top-color:#f0b8c8;border-bottom:0}
  #chat:before{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top-color:#fffaf2;border-bottom:0;z-index:1}
  .head{font-weight:700;color:#c85a7a;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;-webkit-app-region:drag;cursor:move}
  .head .r{display:flex;gap:6px;align-items:center;-webkit-app-region:no-drag}
  .head .x,.head .clr{all:unset;cursor:pointer;color:#8f7f79;font-weight:400;padding:3px 7px;font-size:12.5px;border-radius:8px;line-height:1.2;font-family:inherit}
  .head .x:focus-visible,.head .clr:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #c85a7a;outline-offset:1px}
  .head .x{font-size:14px}
  .head .x:hover,.head .clr:hover{color:#c85a7a;background:#fbe9ef}
  .head .clr.arm{color:#fff;background:#c85a7a}
  .head .prov{font-size:10px;color:#b8a9a2;font-weight:400}
  #log{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:5px;scrollbar-width:thin;padding-right:2px}
  .msg{max-width:92%;padding:5px 9px;border-radius:12px;white-space:pre-wrap;word-break:break-word;user-select:text}
  .msg.user{align-self:flex-end;background:#e9eefc;color:#2f3650;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:#fff;border:1px solid #f3e2e8;border-bottom-left-radius:4px}
  .msg.bot.err{background:#fff3f3;border-color:#f5c2c2;color:#a04040;font-size:12px}
  .msg.bot.cut{opacity:.75;border-style:dashed}
  .msg.bot.typing:after{content:"…";animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .row{display:flex;gap:6px;margin-top:8px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1px solid #f0b8c8;border-radius:10px;padding:6px 8px;font:13px/1.4 "Malgun Gothic",sans-serif;background:#fff;color:#3a2f2a;outline:none;max-height:72px;min-height:32px}
  textarea:focus{border-color:#c85a7a}
  button{border:0;background:#e88aa6;color:#fff;border-radius:10px;padding:0 10px;height:32px;min-width:36px;font:13px "Malgun Gothic",sans-serif;cursor:pointer;flex:none}
  #send{font-size:15px;padding:0 11px}
  button:hover{background:#c85a7a}
  button:disabled{background:#e9d3da;cursor:default}
  button.ghost{background:#fff;border:1px solid #f0b8c8;color:#c85a7a;padding:0 8px;font-size:14px}
  button.ghost.on{background:#c85a7a;color:#fff}
  .hint{font-size:11.5px;color:#8f7f79;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
  .hint .keys{white-space:nowrap}
  #status:not(:empty) ~ .keys{display:none}
  #status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint a,.hint .link{all:unset;color:#c85a7a;cursor:pointer;font:inherit;padding:1px 3px;border-radius:5px}
  .hint .link:focus-visible{outline:2px solid #c85a7a}
  .setup{background:#fff;border:1px dashed #f0b8c8;border-radius:10px;padding:8px 10px;font-size:12px;color:#6a5a54}
  .setup b{color:#c85a7a}
</style></head>
<body>
<div id="chat">
  <div class="head"><span id="who">사도</span><span class="r"><span class="prov" id="prov"></span><button class="clr" id="clear" title="대화 기록 지우기 (한 번 더 누르면 지웁니다)">기록 지우기</button><button class="x" id="close" title="닫기 (Esc)" aria-label="닫기">✕</button></span></div>
  <div id="log"></div>
  <div class="row"><textarea id="in" rows="1" placeholder="메시지 입력"></textarea><button id="cam" class="ghost" title="이 메시지와 함께 지금 화면을 첨부합니다 (설정 → AI 대화 → 화면 캡처 사용 허용)">📷</button><button id="send" title="보내기 (Enter)">➤</button></div>
  <div class="hint"><span id="status"></span><span class="keys" id="keys">Enter 전송 · Shift+Enter 줄바꿈</span><button class="link" id="settings">AI 설정…</button></div>
</div>
<script src="chat.js"></script>
</body></html>
