<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; media-src 'self' file:; connect-src 'self' file:"><title>크레페</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #menu{position:fixed;display:none;width:250px;max-height:70vh;overflow:hidden;background:#2b2b31;color:#eee;border:1px solid #55555f;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.45);font:13px/1.5 "Malgun Gothic",sans-serif;z-index:10}
  #menu .title{padding:8px 12px;font-weight:700;background:#3a3a44;border-radius:8px 8px 0 0}
  #menu .item{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  #menu .item:hover{background:#44444f}
  #menu .item.danger{color:#ff8a8a}
  #menu .sep{height:1px;background:#4a4a55;margin:4px 0}
  #menu .sub{display:none;max-height:38vh;overflow:auto;background:#24242a;border-top:1px solid #4a4a55;border-bottom:1px solid #4a4a55}
  #menu .sub.open{display:block}
  #menu .sub .item{padding:5px 12px 5px 24px;font-size:12px}
  #menu .sub .group{padding:4px 12px;font-size:11px;color:#9a9aa8;background:#1e1e23;position:sticky;top:0}
  #menu input{width:calc(100% - 24px);margin:6px 12px;padding:4px 8px;border-radius:4px;border:1px solid #55555f;background:#1a1a1f;color:#eee;font:12px "Malgun Gothic",sans-serif}
  #menu .chips{display:flex;gap:4px;padding:4px 12px 8px}
  #menu .chip{flex:1;text-align:center;padding:3px 0;border-radius:4px;background:#3a3a44;cursor:pointer;font-size:11px}
  #menu .chip.on{background:#6c8cff;color:#fff}
  #menu .chip:hover{filter:brightness(1.15)}
  #menu .row{display:flex;align-items:center;gap:8px;padding:3px 12px;font-size:12px}
  #menu .row label{width:44px;color:#c9c9d4}
  #menu .row input[type=range]{flex:1;margin:0;accent-color:#6c8cff}
  #menu .row .val{width:34px;text-align:right;color:#9a9aa8;font-variant-numeric:tabular-nums}
  #menu .row.off{opacity:.45}
  #menu .tag{font-size:9px;padding:0 4px;border-radius:3px;background:#3e5a9a;color:#dfe8ff;vertical-align:middle;margin-left:4px}
  #hud{position:fixed;left:8px;top:8px;font:12px/1.4 Consolas,monospace;color:#fff;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px;display:none;pointer-events:none;white-space:pre}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script src="../node_modules/@esotericsoftware/spine-webgl/dist/iife/spine-webgl.js"></script>
<script src="ko.js"></script>
<script src="motion-voice.js"></script>
<script src="mascot.js"></script>
</body></html>
